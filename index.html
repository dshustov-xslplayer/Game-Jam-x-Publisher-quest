<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Jam x Xsolla Publisher: Launch Quest</title>
<meta name="description" content="Register in Publisher Account, upload your jam build to the Xsolla Launcher and verify it with a receipt.">
<link rel="stylesheet" href="ds/xsolla/colors_and_type.css">
<style>
body{margin:0;background:#141d1f}
a{color:#80EAFF}
.xq-btn{transition:filter .2s,background .2s}
.xq-btn:hover{filter:brightness(.92)}
.xq-btn:focus-visible,.xq-chk:focus-visible,a:focus-visible{outline:2px solid #80EAFF;outline-offset:3px}
.xq-chk{cursor:pointer}
@keyframes xq-pop{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes xq-glow{0%{box-shadow:0 0 0 0 rgba(128,234,255,.7)}100%{box-shadow:0 0 0 22px rgba(128,234,255,0)}}
@keyframes xq-toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@keyframes xq-burst{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy2)) rotate(var(--rot))}}
@keyframes xq-rise{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes xq-row{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:none}}
@keyframes xq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes xq-pop2{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes xq-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes xq-drop{0%{opacity:0;transform:translateY(-160px) rotate(-7deg)}55%{opacity:1;transform:translateY(10px) rotate(1.5deg)}78%{transform:translateY(-5px) rotate(-.5deg)}100%{opacity:1;transform:none}}
@keyframes xq-shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.xq-drop{animation:xq-drop 1s cubic-bezier(.2,.8,.3,1) both}
.xq-pop2{animation:xq-pop2 .5s cubic-bezier(.2,.9,.3,1.4)}
.xq-pop{animation:xq-pop .5s cubic-bezier(.2,.9,.3,1.4)}
.xq-glow{animation:xq-glow .9s ease-out}
.xq-row{animation:xq-row .35s ease-out both}
.xq-bar{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xq-p{position:fixed;left:50%;top:32%;border-radius:0;pointer-events:none;animation:xq-burst 1.8s cubic-bezier(.15,.7,.3,1) forwards}
@media (prefers-reduced-motion:reduce){.xq-drop,.xq-cloud,.xq-pop2,.xq-pop,.xq-glow,.xq-row,.xq-cloud,.xq-pop2{animation:none}.xq-p{display:none}.xq-bar{transition:none}}
pre{margin:0}
@media (max-width:720px){.xq-nav-links{display:none!important}}
.xq-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:32px;align-items:start}
.xq-side{order:2}
@media (max-width:760px){.xq-layout{grid-template-columns:minmax(0,1fr)}.xq-side{position:static!important;order:-1}}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="xs-dark" style="background:#141d1f;color:#FFFFFF;font-family:'Aktiv Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100%">

  <!-- FX LAYER -->
  <div aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden">
    <sc-for list="{{ particles }}" as="pt" hint-placeholder-count="0">
      <span class="xq-p" style="width:{{ pt.w }}px;height:{{ pt.h }}px;background:{{ pt.color }};--dx:{{ pt.dx }}px;--dy2:{{ pt.dy2 }}px;--rot:{{ pt.rot }}deg;animation-delay:{{ pt.delay }}ms"></span>
    </sc-for>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" style="position:fixed;left:50%;top:24px;z-index:60;max-width:min(560px,calc(100vw - 32px));background:#233134;border:1px solid #80EAFF;border-radius:0;padding:14px 20px;box-shadow:0 18px 48px rgba(0,0,0,.55),0 0 0 4px rgba(128,234,255,.12);font-weight:600;font-size:15px;color:#FFFFFF;animation:xq-toast 5s ease-in-out forwards">{{ toast }}</div>
  </sc-if>

  <div style="position:relative;overflow:hidden;isolation:isolate">
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 45% at 50% 0%,rgba(128,234,255,.20),transparent 70%),radial-gradient(40% 30% at 8% 30%,rgba(255,195,128,.16),transparent 70%),radial-gradient(40% 30% at 92% 30%,rgba(255,195,128,.16),transparent 70%),linear-gradient(#0b1315,#141d1f 78%)">
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 160px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 90px);-webkit-mask-image:linear-gradient(#000 20%,transparent 75%);mask-image:linear-gradient(#000 20%,transparent 75%)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,rgba(128,234,255,.16) 0 1px,transparent 1px 90px),repeating-linear-gradient(0deg,rgba(128,234,255,.12) 0 1px,transparent 1px 36px),linear-gradient(transparent,rgba(128,234,255,.07));transform:perspective(500px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)"></div>
  </div>
  <!-- NAV -->
  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1200px;margin:0 auto;padding:20px 32px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:16px">
      <svg viewBox="0 0 430.5 91.2" role="img" aria-label="Xsolla" fill="#FFFFFF" style="height:22px;width:auto"><path d="M77.9,25.4c-6.4-1.6-8.4-3.3-10.2-8.9C64.3,5.7,57.4,0,47.7,0s-16.6,5.7-20,16.5c-1.8,5.6-3.8,7.3-10.2,8.9C6.6,28.1-.1,35.6-.1,45.6s6.7,17.5,17.6,20.2c6.4,1.6,8.4,3.3,10.2,8.9,3.4,10.8,10.3,16.5,20,16.5s16.6-5.7,20-16.5c1.8-5.6,3.8-7.3,10.2-8.9,10.9-2.7,17.6-10.2,17.6-20.2s-6.7-17.5-17.6-20.2ZM63.4,61c-6.6,0-12.4-4.8-13.8-10.7h-3.6c-1.5,5.8-7.3,10.7-13.9,10.7s-14.3-6.5-14.3-14.4,6.4-14.3,14.3-14.3,12.4,4.8,13.9,10.6h3.6c1.5-5.9,7.3-10.6,13.8-10.6s14.4,6.4,14.4,14.3-6.5,14.4-14.4,14.4Z"/><rect x="57.7" y="40.9" width="11.5" height="11.5"/><rect x="26.4" y="40.9" width="11.5" height="11.5"/><polygon points="163 10.6 145.7 10.6 129.3 33 112.7 10.6 94.7 10.6 120.4 45 93.5 80.6 110.8 80.6 128.8 56.2 146.9 80.6 165 80.6 137.7 44.2 163 10.6"/><path d="M178.8,30.7l16.9-20.1h-17.4l-9,10.6c-2.9,3.5-4.3,7-4.3,10.8s1.4,7.2,4.3,10.8l13.7,17.2-16.1,20.6h17.8l7.9-10c3-3.8,4.4-7.4,4.4-11.3s-1.4-7.5-4.4-11.3l-13.8-17.3Z"/><path d="M239.6,9c-20.5,0-36.6,16.1-36.6,36.6s16.1,36.6,36.6,36.6,36.6-16.1,36.6-36.6-16.1-36.6-36.6-36.6ZM239.6,68.2c-12.3,0-21.6-9.7-21.6-22.6s9.3-22.6,21.6-22.6,21.6,9.7,21.6,22.6-9.3,22.6-21.6,22.6Z"/><polygon points="273.1 10.6 310.7 80.6 328.3 80.6 290.7 10.6 273.1 10.6"/><path d="M394.3,10.6h-10.5l-28.6,55.2-29.7-55.2h-17.6l37.6,70h85.1l-36.3-70ZM369.8,67.6l18.9-37.6,18.9,37.6h-37.7Z"/></svg>
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9fb0b3">Game Jam</span>
    </div>
    <nav class="xq-nav-links" style="display:flex;align-items:center;gap:28px;font-weight:500;font-size:15px">
      <a href="#how" style="color:#d3dcde;text-decoration:none">How it works</a>
      <a href="#quest" style="color:#d3dcde;text-decoration:none">Checklist</a>
      <a href="#notes" style="color:#d3dcde;text-decoration:none">Good to know</a>
    </nav>
    <a class="xq-btn" href="#quest" style="background:#80EAFF;color:#141d1f;text-decoration:none;font-weight:600;font-size:14px;padding:12px 22px;border-radius:0">Start the checklist</a>
  </header>

  <!-- HERO -->
  <section style="max-width:1200px;margin:0 auto;padding:56px 32px 72px;display:flex;flex-wrap:wrap;gap:56px;align-items:center">
    <div style="flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:24px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#80EAFF">Game Jam × Xsolla Publisher</span>
      <h1 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:clamp(36px,5.4vw,68px);line-height:1.04;letter-spacing:-0.03em;color:#FFFFFF;text-wrap:balance">Get your jam build into the Xsolla Launcher</h1>
      <p style="margin:0;font-size:19px;line-height:1.5;color:#d3dcde;max-width:520px">Twelve steps take your game from a zip archive to a Draft build that testers can install. Three of them are checked for real: a double-click upload app prints a receipt and this page verifies it.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a class="xq-btn" href="#quest" style="background:#80EAFF;color:#141d1f;text-decoration:none;font-weight:600;font-size:16px;padding:16px 28px;border-radius:0">Start the checklist</a>
        <a class="xq-btn" href="#how" style="background:transparent;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:16px;padding:14.5px 26px;border-radius:0;border:1.5px solid #546a6f">See how it works</a>
      </div>
    </div>
    <div style="flex:1 1 420px;min-width:0;background:#233134;border:1px solid #33454a;border-radius:0;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 56px rgba(0,0,0,.6)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9fb0b3">Example receipt</span>
        <span style="font-size:12px;font-weight:600;color:#141d1f;background:{{ demoPillBg }};border-radius:0;padding:4px 12px;transition:background .3s">{{ demoPill }}</span>
      </div>
      <div style="overflow-x:auto;background:#141d1f;border:1px solid #33454a;border-radius:0;padding:16px">
        <pre style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;color:#d3dcde;min-height:262px;white-space:pre-wrap">{{ demoText }}</pre>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px" aria-label="Example checks">
        <sc-for list="{{ demoChecks }}" as="dc" hint-placeholder-count="7">
          <div style="display:flex;align-items:center;gap:10px;font-size:13px">
            <span style="flex:none;min-width:70px;text-align:center;font-size:11px;font-weight:600;border-radius:0;padding:2px 8px;border:1px solid {{ dc.color }};color:{{ dc.color }}">{{ dc.pill }}</span>
            <span style="color:#d3dcde">{{ dc.label }}</span>
          </div>
        </sc-for>
      </div>
      <p style="margin:0;font-size:14px;color:#9fb0b3">Live example: the upload app sends your game to the Draft stage and prints this receipt, then each check turns green. Paste your own receipt into the page below. Players never see a Draft build.</p>
    </div>
  </section>

  <div aria-hidden="true" style="padding:0 32px 32px;opacity:.95"><svg viewBox="0 0 900 170" preserveAspectRatio="xMidYMax meet" aria-hidden="true" style="display:block;width:100%;max-width:900px;height:auto;margin:0 auto"><g transform="translate(90,0)"><rect x="-70" y="30" width="140" height="92" fill="#2b3a3e" stroke="#0b1315" stroke-width="3"/><rect x="-70" y="30" width="140" height="10" fill="#3d5156"/><rect x="-58" y="46" width="116" height="64" fill="#1b2629" stroke="#3d5156" stroke-width="2"/><circle cx="0" cy="78" r="16" fill="none" stroke="#e84f30" stroke-width="5"/><circle cx="0" cy="78" r="6" fill="#e84f30"/><rect x="-34" y="130" width="68" height="7" fill="#e84f30"/><ellipse cx="0" cy="152" rx="60" ry="9" fill="#e84f30" opacity=".35"/></g><g transform="translate(270,0)"><rect x="-70" y="30" width="140" height="92" fill="#2b3a3e" stroke="#0b1315" stroke-width="3"/><rect x="-70" y="30" width="140" height="10" fill="#3d5156"/><rect x="-58" y="46" width="116" height="64" fill="#1b2629" stroke="#3d5156" stroke-width="2"/><rect x="-20" y="70" width="40" height="16" fill="none" stroke="#ffc380" stroke-width="4"/><path d="M-12 78h24" stroke="#ffc380" stroke-width="4"/><rect x="-34" y="130" width="68" height="7" fill="#ffc380"/><ellipse cx="0" cy="152" rx="60" ry="9" fill="#ffc380" opacity=".35"/></g><g transform="translate(450,0)"><rect x="-70" y="30" width="140" height="92" fill="#2b3a3e" stroke="#0b1315" stroke-width="3"/><rect x="-70" y="30" width="140" height="10" fill="#3d5156"/><rect x="-58" y="46" width="116" height="64" fill="#1b2629" stroke="#3d5156" stroke-width="2"/><path d="M0 58l18 10v20L0 98l-18-10V68z" fill="none" stroke="#95ff80" stroke-width="4"/><circle cx="0" cy="78" r="5" fill="#95ff80"/><rect x="-34" y="130" width="68" height="7" fill="#95ff80"/><ellipse cx="0" cy="152" rx="60" ry="9" fill="#95ff80" opacity=".35"/></g><g transform="translate(630,0)"><rect x="-70" y="30" width="140" height="92" fill="#2b3a3e" stroke="#0b1315" stroke-width="3"/><rect x="-70" y="30" width="140" height="10" fill="#3d5156"/><rect x="-58" y="46" width="116" height="64" fill="#1b2629" stroke="#3d5156" stroke-width="2"/><path d="M0 56l16 22-16 22-16-22z" fill="none" stroke="#80EAFF" stroke-width="4"/><g transform="translate(630,112)"><rect x="-9" y="0" width="18" height="14" fill="#141d1f" stroke="#9fb0b3" stroke-width="2"/><path d="M-5 0v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#9fb0b3" stroke-width="2"/></g><rect x="-34" y="130" width="68" height="7" fill="#80EAFF"/><ellipse cx="0" cy="152" rx="60" ry="9" fill="#80EAFF" opacity=".35"/></g><g transform="translate(810,0)"><rect x="-70" y="30" width="140" height="92" fill="#2b3a3e" stroke="#0b1315" stroke-width="3"/><rect x="-70" y="30" width="140" height="10" fill="#3d5156"/><rect x="-58" y="46" width="116" height="64" fill="#1b2629" stroke="#3d5156" stroke-width="2"/><rect x="-22" y="66" width="44" height="24" fill="none" stroke="#80EAFF" stroke-width="4"/><rect x="-14" y="74" width="12" height="8" fill="#80EAFF"/><g transform="translate(810,112)"><rect x="-9" y="0" width="18" height="14" fill="#141d1f" stroke="#9fb0b3" stroke-width="2"/><path d="M-5 0v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#9fb0b3" stroke-width="2"/></g><rect x="-34" y="130" width="68" height="7" fill="#80EAFF"/><ellipse cx="0" cy="152" rx="60" ry="9" fill="#80EAFF" opacity=".35"/></g></svg></div>
</div>

  <!-- FACTS -->
  <section style="max-width:1200px;margin:0 auto;padding:40px 32px 72px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px">
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">12</span><span style="color:#d3dcde">checklist steps</span></div>
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">2</span><span style="color:#d3dcde">platforms: macOS and Windows</span></div>
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">1</span><span style="color:#d3dcde">API key per game</span></div>
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">0</span><span style="color:#d3dcde">players affected: builds stay in Draft</span></div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section id="how" style="max-width:1200px;margin:0 auto;padding:24px 32px 80px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-direction:column;gap:12px;max-width:640px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#80EAFF">How it works</span>
      <h2 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.015em;text-wrap:balance">Four stages, one script</h2>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="17" r="7"/><path d="M10 40c1-8 7-12 14-12s13 4 14 12"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Register</h3>
        <p style="margin:0;color:#d3dcde">Sign up in Publisher Account and create your first project. It takes a few minutes and a confirmation code from your email.</p>
      </div>
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="10" width="32" height="22" rx="0"/><path d="M18 40h12M24 32v8"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Prepare</h3>
        <div style="display:flex;flex-direction:column;gap:8px;color:#d3dcde"><span style="display:block"><b style="color:{{ macLabel }}">macOS:</b> Use a Mac with macOS 12.4 or newer, add the game in Publisher Account, get the macOS Build Loader (Mac/build_loader) and copy the game’s API key.</span><span style="display:block"><b style="color:{{ winLabel }}">Windows:</b> Use a Windows 10 (64-bit) PC, add the game in Publisher Account, get the Windows Build Loader (Win\build_loader.exe) and copy the game’s API key. Keep the game path in Latin letters.</span></div>
      </div>
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 35a7 7 0 0 1-.8-13.9A10 10 0 0 1 31.500 19 7 7 0 0 1 33 35"/><path d="M24 42V27M18 32l6-6 6 6"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Upload</h3>
        <div style="display:flex;flex-direction:column;gap:8px;color:#d3dcde"><span style="display:block"><b style="color:{{ macLabel }}">macOS:</b> Double-click Xsolla Upload.command, drag in your .app, type the name and key. It checks the build, then sends it to Draft.</span><span style="display:block"><b style="color:{{ winLabel }}">Windows:</b> Double-click Xsolla Upload.bat, drag in your game folder, type the name and key. It checks the build, then sends it to Draft.</span></div>
      </div>
      <div style="background:#233134;border:1px solid #33454a;border-radius:0;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 7l15 5v10c0 9-6.300 15-15 19-8.700-4-15-10-15-19V12z"/><path d="M17 24.500l5 5 9-10"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Verify</h3>

    var palette = { ok: ['Passed', '#80EAFF'], fail: ['Failed', '#e84f30'], soft: ['Not confirmed', '#ffc380'], idle: ['Waiting', '#9fb0b3'] };
    var labels = ['Build Loader came from Xsolla', 'Real API key accepted', 'Game name matches', 'Game uploaded to Draft', 'Platform matches your scenario', 'Build listed by Xsolla', 'Receipt is untouched', 'Receipt is fresh'];
    var checks = (v ? v.checks : labels.map(function (l) { return { label: l, state: 'idle', detail: 'Waiting for the receipt.' }; })).map(function (c, i) {
      return { label: c.label, detail: c.detail, pill: palette[c.state][0], color: palette[c.state][1], cls: c.state === 'ok' ? 'xq-row' : '', delay: i * 80 };
    });
    var burst = this.state.burst;
    var rid = (/(?:^|\n)\s*run_id=([\w-]+)/.exec(this.state.receipt || '') || [])[1] || '';
    var tkey = (rid || (this.state.gameName || 'jam')).replace(/[^\w]/g, '').toUpperCase();
    var tnum = 'XQ-' + (tkey + '00000000').slice(0, 8);
    var tdate = new Date().toISOString().slice(0, 10);
    var dn = this.state.demoN, full = DEMO_LINES.join('\n').replace('__P__', this.state.os === 'win' ? 'win' : 'mac'), dtext = full.slice(0, dn), dtyping = dn < full.length;
    var starts = [], acc = 0; DEMO_LINES.forEach(function (l) { starts.push(acc + l.length); acc += l.length + 1; });
    var demoChecks = DEMO_CHECKS.map(function (c) { var ok = dn >= starts[c[1]]; return { label: c[0], pill: ok ? 'Passed' : 'Waiting', color: ok ? '#80EAFF' : '#546a6f' }; });
    var demoOk = dn >= full.length;
    var allItems = register.concat(prepare, upload, verify), nxt = null;
    for (var q = 0; q < allItems.length; q++) { if (!allItems[q].done) { nxt = allItems[q]; break; } }
    var cloudSay = this.state.toast || (nxt ? 'Next: ' + nxt.title : 'Launch Ticket is yours! Next: Generate installer.');
    return {
      register: register, registerCount: cr, prepare: prepare, upload: upload, verify: verify, checks: checks,
      demoText: dtext + (dtyping ? '\u258C' : ''), demoChecks: demoChecks, demoPill: demoOk ? 'Verified' : 'Printing...', demoPillBg: demoOk ? '#80EAFF' : '#ffc380',
      hasTicket: total === 12, ticketGame: (this.state.gameName || 'Your jam game'), ticketNo: tnum, ticketDate: tdate,
      macLabel: '#80EAFF', winLabel: '#80EAFF',
      prepareCard: M ? 'Use a Mac with macOS 12.4 or newer, add the game in Publisher Account, get the macOS Build Loader and copy the game’s API key.' : 'Use a Windows 10 (64-bit) PC, add the game in Publisher Account, get the Windows Build Loader and copy the game’s API key.',
      hasSkipAll: !(v && v.all),
      skipAllNote: 'Receipt will not turn green? Maybe you uploaded another way or the app could not read the key. You can close the three receipt steps by hand and move on.',
      skipAllLabel: (['p3', 'u2', 'u3'].every(function (id) { return map[id]; }) && !(v && v.all)) ? 'Undo: reopen steps 1.3, 2.2 and 2.3' : 'Mark steps 1.3, 2.2 and 2.3 as done manually',
      skipAll: function () { self.skipAll(); },
      scenario: scenario, isMac: M, isWin: !M,
      macBg: M ? '#80EAFF' : 'transparent', macFg: M ? '#141d1f' : '#d3dcde', winBg: !M ? '#80EAFF' : 'transparent', winFg: !M ? '#141d1f' : '#d3dcde',
      setMac: function () { self.setOs('mac'); }, setWin: function () { self.setOs('win'); },
      ctaText: M ? 'Once your build is in Draft and configured, the next separate step is Launcher, Edit launcher, Settings, Launcher build, Generate. For macOS one standalone installer is built, signed with an Xsolla certificate. Generation can take up to several hours, and it is unstable right now, so this checklist stops one step before it.'
                 : 'Once your build is in Draft and configured, the next separate step is Launcher, Edit launcher, Settings, Launcher build, Generate. For Windows two installers are built, a web one and a standalone one, signed with an Xsolla certificate. Generation can take up to several hours, and it is unstable right now, so this checklist stops one step before it.',
      ticketRoute: 'Route: Publisher Account, Draft build, ' + (M ? 'macOS standalone installer' : 'Windows web and standalone installers') + '. Admit one game.',
      cloudSay: cloudSay, cloudPop: this.state.cloudPop,
      prepareCount: cp, uploadCount: cu, verifyCount: cv,
      doneCount: total, pct: Math.round(xp / XQ_TOTAL * 100), statusLine: status,
      xp: xp, xpMax: XQ_TOTAL, rankName: this.rankOf(xp), xpPop: this.state.xpPop, hasXpPop: !!this.state.xpPop,
      doneR: doneR, notDoneR: !doneR, slotRBorder: doneR ? '#80EAFF' : '#33454a', slotRClass: recentStages.R ? 'xq-glow' : '',
      doneA: doneA, doneB: doneB, doneC: doneC,
      notDoneA: !doneA, notDoneB: !doneB, notDoneC: !doneC,
      slotABorder: doneA ? '#80EAFF' : '#33454a', slotAClass: recentStages.A ? 'xq-glow' : '',
      slotBBorder: doneB ? '#80EAFF' : '#33454a', slotBClass: recentStages.B ? 'xq-glow' : '',
      slotCBorder: doneC ? '#80EAFF' : '#33454a', slotCClass: recentStages.C ? 'xq-glow' : '',
      gameName: this.state.gameName, receiptText: this.state.receipt,
      receiptOk: !!(v && v.all), receiptSummary: v ? v.summary : '',
      hasToast: !!this.state.toast, toast: this.state.toast,
      hasBurst: !!burst, particles: this.particles(burst),
      soundLabel: this.state.sound ? 'Sound: on' : 'Sound: off', soundOn: this.state.sound,
      toggleSound: function () { self.toggleSound(); },
      onGame: function (e) {
        var val = e.target.value;
        self.setState({ gameName: val });
        self.persist(self.state.done, val, self.state.receipt, self.state.sound);
        self.runVerify(self.state.receipt, val, false);
      },
      onReceipt: function (e) {
        var val = e.target.value;
        self.setState({ receipt: val });
        self.persist(self.state.done, self.state.gameName, val, self.state.sound);
        self.runVerify(val, self.state.gameName, false);
      },
      reset: function () { self.setState({ done: {}, gameName: '', receipt: '', verdict: null, toast: '', burst: '' }); self.persist({}, '', '', self.state.sound, self.state.os); }
    };
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
