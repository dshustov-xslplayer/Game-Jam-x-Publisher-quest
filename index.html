<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Jam x Xsolla Publisher: Launch Quest</title>
<meta name="description" content="Register in Publisher Account, upload your jam build to the Xsolla Launcher and verify it with a receipt.">
<link rel="stylesheet" href="ds/xsolla/colors_and_type.css">
<style>
body{margin:0;background:#0A0A0F}
a{color:#80EAFF}
.xq-btn{transition:filter .2s,background .2s}
.xq-btn:hover{filter:brightness(.92)}
.xq-btn:focus-visible,.xq-chk:focus-visible,a:focus-visible{outline:2px solid #80EAFF;outline-offset:3px}
.xq-chk{cursor:pointer}
@keyframes xq-pop{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes xq-glow{0%{box-shadow:0 0 0 0 rgba(128,234,255,.7)}100%{box-shadow:0 0 0 22px rgba(128,234,255,0)}}
@keyframes xq-toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@keyframes xq-burst{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy2)) rotate(var(--rot))}}
@keyframes xq-rise{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes xq-row{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:none}}
.xq-pop{animation:xq-pop .5s cubic-bezier(.2,.9,.3,1.4)}
.xq-glow{animation:xq-glow .9s ease-out}
.xq-row{animation:xq-row .35s ease-out both}
.xq-bar{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xq-p{position:fixed;left:50%;top:32%;border-radius:2px;pointer-events:none;animation:xq-burst 1.8s cubic-bezier(.15,.7,.3,1) forwards}
@media (prefers-reduced-motion:reduce){.xq-pop,.xq-glow,.xq-row{animation:none}.xq-p{display:none}.xq-bar{transition:none}}
pre{margin:0}
@media (max-width:720px){.xq-nav-links{display:none!important}}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="xs-dark" style="background:#0A0A0F;color:#FFFFFF;font-family:'Aktiv Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100%">

  <!-- FX LAYER -->
  <div aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden">
    <sc-for list="{{ particles }}" as="pt" hint-placeholder-count="0">
      <span class="xq-p" style="width:{{ pt.w }}px;height:{{ pt.h }}px;background:{{ pt.color }};--dx:{{ pt.dx }}px;--dy2:{{ pt.dy2 }}px;--rot:{{ pt.rot }}deg;animation-delay:{{ pt.delay }}ms"></span>
    </sc-for>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" style="position:fixed;left:50%;top:24px;z-index:60;max-width:min(560px,calc(100vw - 32px));background:#15151D;border:1px solid #80EAFF;border-radius:16px;padding:14px 20px;box-shadow:0 18px 48px rgba(0,0,0,.55),0 0 0 4px rgba(128,234,255,.12);font-weight:600;font-size:15px;color:#FFFFFF;animation:xq-toast 5s ease-in-out forwards">{{ toast }}</div>
  </sc-if>

  <!-- NAV -->
  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1200px;margin:0 auto;padding:20px 32px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:16px">
      <svg viewBox="0 0 430.5 91.2" role="img" aria-label="Xsolla" fill="#FFFFFF" style="height:22px;width:auto"><path d="M77.9,25.4c-6.4-1.6-8.4-3.3-10.2-8.9C64.3,5.7,57.4,0,47.7,0s-16.6,5.7-20,16.5c-1.8,5.6-3.8,7.3-10.2,8.9C6.6,28.1-.1,35.6-.1,45.6s6.7,17.5,17.6,20.2c6.4,1.6,8.4,3.3,10.2,8.9,3.4,10.8,10.3,16.5,20,16.5s16.6-5.7,20-16.5c1.8-5.6,3.8-7.3,10.2-8.9,10.9-2.7,17.6-10.2,17.6-20.2s-6.7-17.5-17.6-20.2ZM63.4,61c-6.6,0-12.4-4.8-13.8-10.7h-3.6c-1.5,5.8-7.3,10.7-13.9,10.7s-14.3-6.5-14.3-14.4,6.4-14.3,14.3-14.3,12.4,4.8,13.9,10.6h3.6c1.5-5.9,7.3-10.6,13.8-10.6s14.4,6.4,14.4,14.3-6.5,14.4-14.4,14.4Z"/><rect x="57.7" y="40.9" width="11.5" height="11.5"/><rect x="26.4" y="40.9" width="11.5" height="11.5"/><polygon points="163 10.6 145.7 10.6 129.3 33 112.7 10.6 94.7 10.6 120.4 45 93.5 80.6 110.8 80.6 128.8 56.2 146.9 80.6 165 80.6 137.7 44.2 163 10.6"/><path d="M178.8,30.7l16.9-20.1h-17.4l-9,10.6c-2.9,3.5-4.3,7-4.3,10.8s1.4,7.2,4.3,10.8l13.7,17.2-16.1,20.6h17.8l7.9-10c3-3.8,4.4-7.4,4.4-11.3s-1.4-7.5-4.4-11.3l-13.8-17.3Z"/><path d="M239.6,9c-20.5,0-36.6,16.1-36.6,36.6s16.1,36.6,36.6,36.6,36.6-16.1,36.6-36.6-16.1-36.6-36.6-36.6ZM239.6,68.2c-12.3,0-21.6-9.7-21.6-22.6s9.3-22.6,21.6-22.6,21.6,9.7,21.6,22.6-9.3,22.6-21.6,22.6Z"/><polygon points="273.1 10.6 310.7 80.6 328.3 80.6 290.7 10.6 273.1 10.6"/><path d="M394.3,10.6h-10.5l-28.6,55.2-29.7-55.2h-17.6l37.6,70h85.1l-36.3-70ZM369.8,67.6l18.9-37.6,18.9,37.6h-37.7Z"/></svg>
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A9AA8">Game Jam</span>
    </div>
    <nav class="xq-nav-links" style="display:flex;align-items:center;gap:28px;font-weight:500;font-size:15px">
      <a href="#how" style="color:#C8C8D0;text-decoration:none">How it works</a>
      <a href="#quest" style="color:#C8C8D0;text-decoration:none">Checklist</a>
      <a href="#notes" style="color:#C8C8D0;text-decoration:none">Good to know</a>
    </nav>
    <a class="xq-btn" href="#quest" style="background:#80EAFF;color:#0A0A0F;text-decoration:none;font-weight:600;font-size:14px;padding:12px 22px;border-radius:999px">Start the checklist</a>
  </header>

  <!-- HERO -->
  <section style="max-width:1200px;margin:0 auto;padding:56px 32px 72px;display:flex;flex-wrap:wrap;gap:56px;align-items:center">
    <div style="flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:24px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#80EAFF">Game Jam × Xsolla Publisher</span>
      <h1 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:clamp(36px,5.4vw,68px);line-height:1.04;letter-spacing:-0.03em;color:#FFFFFF;text-wrap:balance">Get your jam build into the Xsolla Launcher</h1>
      <p style="margin:0;font-size:19px;line-height:1.5;color:#C8C8D0;max-width:520px">Twelve steps take your game from a zip archive to a Draft build that testers can install. Three of them are checked for real: a double-click upload app prints a receipt and this page verifies it.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a class="xq-btn" href="#quest" style="background:#80EAFF;color:#0A0A0F;text-decoration:none;font-weight:600;font-size:16px;padding:16px 28px;border-radius:999px">Start the checklist</a>
        <a class="xq-btn" href="#how" style="background:transparent;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:16px;padding:14.5px 26px;border-radius:999px;border:1.5px solid #4A4A57">See how it works</a>
      </div>
    </div>
    <div style="flex:1 1 420px;min-width:0;background:#15151D;border:1px solid #2A2A35;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 56px rgba(0,0,0,.6)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A9AA8">Example receipt</span>
        <span style="font-size:12px;font-weight:600;color:#0A0A0F;background:#80EAFF;border-radius:999px;padding:4px 12px">Draft</span>
      </div>
      <div style="overflow-x:auto;background:#0A0A0F;border:1px solid #2A2A35;border-radius:12px;padding:16px">
        <pre style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;color:#C8C8D0">XSOLLA-QUEST-RECEIPT v1
builder_version=1.23.0
builder_signer=Xsolla (USA), Inc (2FWGTXK3RK)
builder_signature_valid=yes
key_mask=AB12...xyz
init_result=success
game_name=My Jam Game
update_result=success
<span style="color:#80EAFF;font-weight:600">build_in_list=yes</span></pre>
      </div>
      <p style="margin:0;font-size:14px;color:#9A9AA8">The upload app sends your game to the Draft stage and prints this receipt. Paste it into the page below. Players never see a Draft build.</p>
    </div>
  </section>

  <!-- FACTS -->
  <section style="max-width:1200px;margin:0 auto;padding:0 32px 72px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">9</span><span style="color:#C8C8D0">checklist steps</span></div>
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">2</span><span style="color:#C8C8D0">platforms: macOS and Windows</span></div>
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">1</span><span style="color:#C8C8D0">API key per game</span></div>
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.03em;color:#80EAFF">0</span><span style="color:#C8C8D0">players affected: builds stay in Draft</span></div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section id="how" style="max-width:1200px;margin:0 auto;padding:24px 32px 80px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-direction:column;gap:12px;max-width:640px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#80EAFF">How it works</span>
      <h2 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.015em;text-wrap:balance">Four stages, one script</h2>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="17" r="7"/><path d="M10 40c1-8 7-12 14-12s13 4 14 12"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Register</h3>
        <p style="margin:0;color:#C8C8D0">Sign up in Publisher Account and create your first project. It takes a few minutes and a confirmation code from your email.</p>
      </div>
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="10" width="32" height="22" rx="3"/><path d="M18 40h12M24 32v8"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Prepare</h3>
        <p style="margin:0;color:#C8C8D0">Use a Mac for a macOS build, add the game in Publisher Account and grab Build Loader with the game's API key.</p>
      </div>
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 35a7 7 0 0 1-.8-13.9A10 10 0 0 1 31.500 19 7 7 0 0 1 33 35"/><path d="M24 42V27M18 32l6-6 6 6"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Upload</h3>
        <p style="margin:0;color:#C8C8D0">Double-click the Xsolla Upload app, drag in your game and type the name and key. It does a dry run, then sends the build to Draft.</p>
      </div>
      <div style="background:#15151D;border:1px solid #2A2A35;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#80EAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 7l15 5v10c0 9-6.300 15-15 19-8.700-4-15-10-15-19V12z"/><path d="M17 24.500l5 5 9-10"/></svg>
        <h3 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.015em">Verify</h3>
        <p style="margin:0;color:#C8C8D0">Paste the receipt for an automatic check, then find the build row in Publisher Account and set its start file.</p>
      </div>
    </div>
  </section>

  <!-- CHECKLIST -->
  <section id="quest" style="background:#15151D;border-top:1px solid #2A2A35;border-bottom:1px solid #2A2A35">
    <div style="max-width:1200px;margin:0 auto;padding:80px 32px;display:flex;flex-direction:column;gap:40px">
      <div style="display:flex;flex-direction:column;gap:12px;max-width:640px">
        <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#80EAFF">The checklist</span>
        <h2 style="margin:0;font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.015em;text-wrap:balance">Tick each step as you finish it</h2>
        <p style="margin:0;color:#C8C8D0">Your progress stays in this browser. Finish a stage to unlock its item.</p>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
        <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:32px">

          <!-- Stage 0 -->
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:18px">Stage 0: Register in Publisher Account</span>
              <span style="font-size:13px;color:#9A9AA8">{{ registerCount }} of 3</span>
            </div>
            <sc-for list="{{ register }}" as="it" hint-placeholder-count="3">
              <div class="{{ it.glow }}" style="display:flex;gap:16px;align-items:flex-start;background:#0A0A0F;border:1px solid {{ it.border }};border-radius:16px;padding:20px">
                <sc-if value="{{ it.isManual }}" hint-placeholder-val="{{ true }}">
                  <button class="xq-chk {{ it.pop }}" type="button" onClick="{{ it.toggle }}" aria-pressed="{{ it.done }}" aria-label="{{ it.label }}" style="flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid #4A4A57;background:#15151D;display:flex;align-items:center;justify-content:center;padding:0">
                    <sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}">
                      <span style="width:44px;height:44px;border-radius:12px;background:#80EAFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></span>
                    </sc-if>
                  </button>
                </sc-if>
                <sc-if value="{{ it.isAuto }}" hint-placeholder-val="{{ false }}">
                  <div aria-hidden="true" class="{{ it.pop }}" style="flex:none;width:44px;height:44px;border-radius:12px;border:1.5px dashed {{ it.autoBorder }};background:{{ it.autoBg }};display:flex;align-items:center;justify-content:center">
                    <sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></sc-if>
                  </div>
                </sc-if>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
                  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <h3 style="margin:0;font-family:'Aktiv Grotesk',system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.3;color:#FFFFFF">{{ it.title }}</h3>
                    <sc-if value="{{ it.isAuto }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid {{ it.pillColor }};color:{{ it.pillColor }}">{{ it.pill }}</span></sc-if>
                  </div>
                  <p style="margin:0;color:#C8C8D0;font-size:15px">{{ it.body }}</p>
                </div>
              </div>
            </sc-for>
                      <p style="margin:0;font-size:13px;color:#9A9AA8">Summary of <a href="https://developers.xsolla.com/ru/get-started/work-in-pa/create-first-project/" target="_blank" rel="noopener" style="color:#80EAFF">Create first project</a> in the Xsolla docs. Already have an account and a project? Tick the three steps and move on.</p>
          </div>

          <!-- Stage 1 -->
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-family:'Pilat Wide',system-ui,sans-serif;font-weight:600;font-size:18px">Stage 1: Prepare</span>
              <span style="font-size:13px;color:#9A9AA8">{{ prepareCount }} of 3</span>
            </div>
            <sc-for list="{{ prepare }}" as="it" hint-placeholder-count="3">
              <div class="{{ it.glow }}" style="display:flex;gap:16px;align-items:flex-start;background:#0A0A0F;border:1px solid {{ it.border }};border-radius:16px;padding:20px">
                <sc-if value="{{ it.isManual }}" hint-placeholder-val="{{ true }}">
                  <button class="xq-chk {{ it.pop }}" type="button" onClick="{{ it.toggle }}" aria-pressed="{{ it.done }}" aria-label="{{ it.label }}" style="flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid #4A4A57;background:#15151D;display:flex;align-items:center;justify-content:center;padding:0">
                    <sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}">
                      <span style="width:44px;height:44px;border-radius:12px;background:#80EAFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></span>
                    </sc-if>
                  </button>
                </sc-if>
                <sc-if value="{{ it.isAuto }}" hint-placeholder-val="{{ false }}">
                  <div aria-hidden="true" class="{{ it.pop }}" style="flex:none;width:44px;height:44px;border-radius:12px;border:1.5px dashed {{ it.autoBorder }};background:{{ it.autoBg }};display:flex;align-items:center;justify-content:center">
                    <sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></sc-if>
                  </div>
                </sc-if>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
                  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <h3 style="margin:0;font-family:'Aktiv Grotesk',system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.3;color:#FFFFFF">{{ it.title }}</h3>
                    <sc-if value="{{ it.isAuto }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid {{ it.pillColor }};color:{{ it.pillColor }}">{{ it.pill }}</span></sc-if>
                  </div>
